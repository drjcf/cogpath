<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>cogpath end card</title>
<meta name="viewport" content="width=1920">
<style>
  /* Fonts come from web/node_modules (run `npm install` in web/ first). */
  @font-face { font-family: "IBM Plex Sans"; font-weight: 400; src: url("../../web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 500; src: url("../../web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Sans"; font-weight: 600; src: url("../../web/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "IBM Plex Mono"; font-weight: 400; src: url("../../web/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2") format("woff2"); }
  html, body { margin: 0; padding: 0; background: #fbfbf9; }
  body { width: 1920px; height: 1080px; overflow: hidden; }
  svg { display: block; width: 1920px; height: 1080px; }
  text { font-family: "IBM Plex Sans", system-ui, sans-serif; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script>
'use strict';
/* Closing card for the cogpath demo video (docs/DEMO.md): the wordmark and compact path of the opening animation's last frame,
   the links and model on screen, and the EdAI Systems lockup. Render with `node docs/video/endcard.cjs`. Tokens follow web/DESIGN.md. */
const NS = 'http://www.w3.org/2000/svg';
const C = { paper: '#fbfbf9', ink: '#15202b', muted: '#5f6b76', rule: '#dce1e6', ruleS: '#b9c2cb',
  recall: '#2f5fa8', analyze: '#0f8b8d', evaluate: '#c47f17', synthesize: '#7b3fa0',
  recallBg: '#e9eff9', analyzeBg: '#e3f3f3', evaluateBg: '#faf0df', synthesizeBg: '#f1e8f7' };
const svg = document.getElementById('stage');
const S = (tag, a = {}, par = svg) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); par.appendChild(e); return e; };
const TX = (s, a, par = svg) => { const e = S('text', { 'text-anchor': 'middle', fill: C.ink, ...a }, par); e.textContent = s; return e; };

(async () => {
  await Promise.all(['400 20px "IBM Plex Sans"', '500 20px "IBM Plex Sans"', '600 20px "IBM Plex Sans"', '400 20px "IBM Plex Mono"'].map((f) => document.fonts.load(f)));
  await new Promise((res, rej) => { const im = new Image(); im.onload = res; im.onerror = () => rej(new Error('logo not found: docs/video/brand/edai-lockup-mono-navy.svg')); im.src = 'brand/edai-lockup-mono-navy.svg'; });
  S('rect', { width: 1920, height: 1080, fill: C.paper });

  TX('cogpath', { x: 960, y: 310, 'font-size': 190, 'font-weight': 600, style: 'letter-spacing:-0.01em' });

  // the compact path, as on the last frame of the animation
  const FS = 36, steps = [['Recall', '4', 'recall'], ['Analyze', 'causal', 'analyze'], ['Evaluate', 'efficacy, safety', 'evaluate'], ['Synthesize', 'management plan', 'synthesize']];
  const path = S('g'), pills = [];
  steps.forEach(([name, arg, opn]) => {
    const g = S('g', {}, path);
    const bg = S('rect', { rx: FS * 0.95, ry: FS * 0.95, height: FS * 1.9, y: -FS * 0.95, fill: C[opn + 'Bg'] }, g);
    const nm = TX(name, { x: FS * 0.75, y: FS * 0.36, 'text-anchor': 'start', 'font-size': FS, 'font-weight': 600, fill: C[opn] }, g);
    const ar = TX(arg, { x: 0, y: FS * 0.34, 'text-anchor': 'start', 'font-size': FS * 0.82, fill: C[opn], class: 'mono' }, g);
    const nw = nm.getComputedTextLength();
    ar.setAttribute('x', FS * 0.75 + nw + FS * 0.4);
    const w = FS * 0.75 * 2 + nw + FS * 0.4 + ar.getComputedTextLength();
    bg.setAttribute('width', w);
    pills.push({ g, w });
  });
  const RULE = FS * 1.6, total = pills.reduce((a, p) => a + p.w, 0) + RULE * 3, K = Math.min(1, 1700 / total) * 0.78;
  let x = -total / 2;
  pills.forEach((p, i) => {
    p.g.setAttribute('transform', `translate(${x.toFixed(2)} 0)`); x += p.w;
    if (i < 3) { S('line', { x1: x + 8, y1: 0, x2: x + RULE - 8, y2: 0, stroke: C.ruleS, 'stroke-width': 3, 'stroke-linecap': 'round' }, path); x += RULE; }
  });
  path.setAttribute('transform', `translate(960 430) scale(${K.toFixed(4)})`);

  const links = S('text', { x: 960, y: 580, 'text-anchor': 'middle', 'font-size': 50, fill: C.muted });
  const t1 = S('tspan', { fill: C.ink, 'font-weight': 600 }, links); t1.textContent = 'cogpath.org';
  const t2 = S('tspan', {}, links); t2.textContent = '   ·   github.com/drjcf/cogpath';
  TX('Meta Model API, Muse Spark 1.3', { x: 960, y: 655, 'font-size': 40, fill: C.muted });

  S('line', { x1: 760, y1: 735, x2: 1160, y2: 735, stroke: C.rule, 'stroke-width': 3 });
  TX('built by', { x: 960, y: 805, 'font-size': 30, fill: C.muted });
  // the supplied lockup (820x300 viewBox, content centred near x 385, y 149) at 1.1x
  S('image', { href: 'brand/edai-lockup-mono-navy.svg', x: 536, y: 775, width: 902, height: 330 });

  window.READY = true;
})();
</script>
</body>
</html>
